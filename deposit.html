<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar - MyWallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wallet-card bg-white">
        <h2 class="text-center mb-4">Depositar</h2>
        
        <form>
            <div class="mb-4">
                <label for="monto" class="form-label text-muted">Monto a depositar</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text">$</span>
                    <input type="number" id="monto" class="form-control" placeholder="0.00" min="1">
                </div>
                <div class="form-text mt-2">
                    El depósito se reflejará de inmediato en tu saldo.
                </div>
            </div>

            <div class="d-grid gap-2">
                <a href="menu.html" class="btn btn-success btn-lg">Realizar depósito</a>
                
                <a href="menu.html" class="btn btn-link text-decoration-none text-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
